name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: foundation (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: br_admin
          POSTGRES_PASSWORD: br_admin_dev_only
          POSTGRES_DB: bragging_rights
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U br_admin -d bragging_rights"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate per-run development secrets (no repository-known keys)
        run: |
          VAULT_KEY=$(openssl rand -hex 32); AUTH_SECRET=$(openssl rand -hex 32); EVIDENCE_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$VAULT_KEY"; echo "::add-mask::$AUTH_SECRET"; echo "::add-mask::$EVIDENCE_KEY"
          echo "BR_VAULT_DEV_KEY=$VAULT_KEY" >> "$GITHUB_ENV"
          echo "BR_DEV_AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          # BRT-06: per-run encrypted evidence store in a temp directory (never committed keys).
          echo "BR_EVIDENCE_DEV_KEY=$EVIDENCE_KEY" >> "$GITHUB_ENV"
          echo "BR_EVIDENCE_DEV_DIR=$RUNNER_TEMP/br-evidence-dev" >> "$GITHUB_ENV"
      - name: Format check
        run: pnpm format:check
      - name: Lint (incl. key-material, result-ledger composition, no-manual-verification and no-manual-authority guards)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + property tests (incl. golden vectors, format engines, lifecycles, BRT-06 crypto/vectors, storage encryption, bundle determinism, BRT-07 V0–V4 engine / policy / snapshot determinism / reference fixtures)
        run: pnpm test
      - name: Golden vectors — BR-JSON v1 + BRT-06 + BRT-07, reproduce + independent reference checkers
        run: pnpm vectors:check
      - name: Bootstrap roles and databases
        run: pnpm db:bootstrap
      - name: Migrate from a clean database
        run: pnpm db:migrate
      - name: Integration tests (PostgreSQL; incl. privacy, capacity concurrency, hierarchy, roles, evidence/attestation, verification runs / freshness / participation / authority / concurrency / fixture non-persistence)
        run: pnpm test:integration
      - name: Acceptance walkthrough (BRT-03 foundation)
        run: pnpm demo:foundation
      - name: Acceptance walkthrough (BRT-04 identity, passport, organizations)
        run: pnpm demo:identity
      - name: Identity seed is idempotent (fictional data, run twice)
        run: pnpm db:seed:identity && pnpm db:seed:identity
      - name: Acceptance walkthrough (BRT-05 sport catalog, competition & event engine)
        run: pnpm demo:competition
      - name: Competition seed is idempotent (fictional data, run twice, identical output)
        run: |
          pnpm -s db:seed:competition > seed-competition-1.json
          pnpm -s db:seed:competition > seed-competition-2.json
          cmp seed-competition-1.json seed-competition-2.json
      - name: Acceptance walkthrough (BRT-06 evidence & attestation)
        run: pnpm demo:evidence
      - name: Evidence seed is idempotent (fictional data, run twice, identical output)
        run: |
          pnpm -s db:seed:evidence > seed-evidence-1.json
          pnpm -s db:seed:evidence > seed-evidence-2.json
          cmp seed-evidence-1.json seed-evidence-2.json
      - name: Acceptance walkthrough (BRT-07 verification engine / sports oracle)
        run: pnpm demo:verification
      - name: Verification seed is idempotent (fictional data, run twice, identical output)
        run: |
          pnpm -s db:seed:verification > seed-verification-1.json
          pnpm -s db:seed:verification > seed-verification-2.json
          cmp seed-verification-1.json seed-verification-2.json
      - name: Worker smoke (one outbox polling round, incl. verification events)
        run: pnpm --filter @br/worker exec tsx src/main.ts --once
      - name: Web build
        run: pnpm --filter @br/web build

  d13-qualification:
    name: D-13 acceptance and regression proof
    if: github.ref == 'refs/heads/fix/oncf-wp-p0-4-advancement-preflight' || github.head_ref == 'fix/oncf-wp-p0-4-advancement-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: br_admin
          POSTGRES_PASSWORD: br_admin_dev_only
          POSTGRES_DB: bragging_rights
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U br_admin -d bragging_rights"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate disposable test keys
        run: |
          for name in BR_VAULT_DEV_KEY BR_DEV_AUTH_SECRET BR_EVIDENCE_DEV_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "BR_EVIDENCE_DEV_DIR=$RUNNER_TEMP/br-evidence-dev" >> "$GITHUB_ENV"
      - name: Prove deployment guard and format boundaries
        run: pnpm exec vitest run --project unit tooling/d13-deployment.test.ts packages/competition/src/advancement/preflight.test.ts apps/web/app/_tests/structure-teams.test.tsx
      - name: Green — API refusals, 50 races in each order, complete tennis journey
        env:
          ONCF_P04_RACE_RUNS: '50'
        run: pnpm exec vitest run --project integration apps/api/src/oncf-p0-4.int.test.ts
      - name: Red — same refusal test against the assessed base lock implementation
        shell: bash
        run: |
          set -euo pipefail
          base=e128cb32a5ba25687dfe8481b55a380fb418ba3f
          # Only this disposable Actions checkout changes; the test and other code stay fixed.
          git show "$base:packages/persistence/src/competition-structure-store.ts" > packages/persistence/src/competition-structure-store.ts
          set +e
          pnpm exec vitest run --project integration apps/api/src/oncf-p0-4.int.test.ts -t 'refuses field lock without advancement and writes no field facts' --reporter=json --outputFile="$RUNNER_TEMP/d13-red.json"
          status=$?
          set -e
          test "$status" -ne 0
          # A missing import, infrastructure error or unrelated failure is not regression proof.
          node --input-type=module - "$RUNNER_TEMP/d13-red.json" <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const assertions = report.testResults.flatMap((file) => file.assertionResults);
          const failure = assertions.find((test) => test.status === 'failed' && test.fullName.includes('refuses field lock without advancement and writes no field facts'));
          if (!failure?.failureMessages.some((message) => /expected 200 to be 409/.test(message))) {
            throw new Error('The base did not reproduce the specific D-13 HTTP 200 versus 409 defect');
          }
          JS
