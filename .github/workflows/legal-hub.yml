name: legal-hub

# ONCHAINFEST-LEGAL-01/03/04 · legal.onchainfest.xyz — legal hub BUILD (untrusted side).
#
# Runs the repository's code (tests, legal/scripts/build.mjs) with NO secrets and a read-only
# token, then uploads one artifact, `legal-hub-site`: the static site plus a manifest. It never
# deploys. Deployment is legal-hub-deploy.yml, a `workflow_run` workflow that always runs from
# the default branch, verifies this artifact as untrusted data and deploys it.
#
# The website (`onchainfest-web-site`, vercel.json, .vercelignore, vercel-deploy.yml) is untouched.
# See docs/operations/ONCF-LEGAL-01-LEGAL-HUB.md.

on:
  pull_request:
    paths: ['legal/**', '.github/legal-hub/**', '.github/workflows/legal-hub*.yml']
  push:
    branches: [main]
    paths: ['legal/**', '.github/legal-hub/**', '.github/workflows/legal-hub*.yml']

permissions:
  contents: read

jobs:
  build:
    name: legal hub build
    runs-on: ubuntu-latest
    env:
      # The commit the artifact is built from and labelled with: the PR head (not GitHub's
      # merge commit), so it matches workflow_run.head_sha on the deploy side.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Hub and workflow tests
        run: node --test legal/test/*.test.mjs
      - name: Artifact verification tests (path traversal, symlinks, tampering, types, project ids)
        run: python3 -I -m unittest discover -s .github/legal-hub -p 'test_*.py'
      - name: Build
        run: node legal/scripts/build.mjs
      # Production is enabled: a push to main must already be publishable (first legal gate;
      # the deploy side checks the content again, independently).
      - name: Publishable gate (pushes to main, production enabled)
        if: github.event_name == 'push' && vars.LEGAL_HUB_PRODUCTION_ENABLED == 'true'
        run: node legal/scripts/build.mjs --require-publishable
      - name: Package artifact
        run: >-
          python3 -I .github/legal-hub/artifact.py package
          --dist legal/dist --out "$RUNNER_TEMP/legal-hub-site"
          --repository "$GITHUB_REPOSITORY" --sha "$HEAD_SHA"
          --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME"
      - name: Self-check (the deploy-side verification, preview mode)
        run: >-
          python3 -I .github/legal-hub/artifact.py selfcheck
          --dir "$RUNNER_TEMP/legal-hub-site"
          --repository "$GITHUB_REPOSITORY" --sha "$HEAD_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: legal-hub-site
          path: ${{ runner.temp }}/legal-hub-site/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Record artifact digest
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "### Legal hub artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "id ${ARTIFACT_ID}, digest sha256:${DIGEST}, commit ${HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"
