# ONCF-LOCAL-PILOT-01 · Disposable, loopback-only copy of the STG-01A staging stack on one workstation.
#
# This is an OVERLAY applied after deploy/staging/compose.yml; it never replaces it:
#
#   docker compose -f deploy/staging/compose.yml -f deploy/local-pilot/compose.yml \
#     --env-file "$PILOT_STATE_DIR/pilot.env" …
#
# (deploy/local-pilot/pilot.sh wraps exactly that.) Relative paths below resolve against
# deploy/staging, the project directory of the first file.
#
# What changes compared with staging, and why:
# - Own project name, so every container, network and volume is `oncf-local-pilot-01_*`.
# - Caddy publishes 127.0.0.1:8443 only (no 80/443, nothing on other interfaces). TLS uses a
#   throwaway local CA generated by init-state.sh instead of ACME; there is no public DNS.
# - Supabase Auth runs locally (GoTrue, the image the Supabase CLI runs, with its own Postgres and a
#   Mailpit mailbox) behind the same Caddy at https://auth.oncf-pilot.localhost:8443. The API keeps
#   NODE_ENV=production and therefore its https-only, JWKS-only (ES256/RS256) verification.
# - The API and the web app trust the local CA through NODE_EXTRA_CA_CERTS (nothing else).
# - Signature audience bragging-rights:local-pilot (never staging's or production's).
# - api-egress becomes internal: the only thing the API reaches outside its networks is the auth
#   proxy, so it has no internet access at all.
# - GoTrue's admin endpoints are not routed: accounts are created and confirmed only through the
#   public sign-up flow and the confirmation email.
# - The web sign-up limiter allows 10 per IP per hour instead of 5 (D-P5), because all pilot
#   participants share one address. Caddy replaces any client-sent X-Forwarded-For, so the key is
#   the real peer.
name: oncf-local-pilot-01

services:
  api:
    image: oncf-local-pilot-01-api:${STAGING_IMAGE_TAG:?set in pilot.env}
    environment:
      BR_SIGNATURE_AUDIENCE: bragging-rights:local-pilot
      NODE_EXTRA_CA_CERTS: /run/pilot-ca/ca.crt
    volumes:
      - ${PILOT_STATE_DIR:?set in pilot.env}/tls/ca.crt:/run/pilot-ca/ca.crt:ro

  worker:
    image: oncf-local-pilot-01-worker:${STAGING_IMAGE_TAG:?set in pilot.env}

  ops:
    image: oncf-local-pilot-01-api:${STAGING_IMAGE_TAG:?set in pilot.env}

  web:
    image: oncf-local-pilot-01-web:${STAGING_IMAGE_TAG:?set in pilot.env}
    build:
      args:
        NEXT_PUBLIC_MARKETING_URL: https://${STAGING_DOMAIN:?set in pilot.env}
    environment:
      NODE_EXTRA_CA_CERTS: /run/pilot-ca/ca.crt
      # D-P5: every pilot participant signs up from the one loopback address. Sized for the
      # seven-account demonstration plus retries; the app caps it at 30 and staging never sets it.
      AUTH_SIGNUP_LIMIT_PER_IP: '10'
    volumes:
      - ${PILOT_STATE_DIR:?set in pilot.env}/tls/ca.crt:/run/pilot-ca/ca.crt:ro

  caddy:
    ports: !override
      - '127.0.0.1:8443:8443'
    environment: !override
      PILOT_SITE_HOST: oncf-pilot.localhost
      PILOT_AUTH_HOST: auth.oncf-pilot.localhost
    volumes: !override
      - ../local-pilot/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PILOT_STATE_DIR:?set in pilot.env}/tls/site.crt:/etc/caddy/tls/site.crt:ro
      - ${PILOT_STATE_DIR:?set in pilot.env}/tls/site.key:/etc/caddy/tls/site.key:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        aliases:
          - oncf-pilot.localhost
          - auth.oncf-pilot.localhost
      api-egress:
        aliases:
          - auth.oncf-pilot.localhost
      auth-app: {}
    depends_on:
      auth:
        condition: service_healthy

  auth-db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PILOT_AUTH_DB_SUPERUSER_PASSWORD:?set in pilot.env}
      POSTGRES_DB: postgres
      PILOT_AUTH_ADMIN_PASSWORD: ${PILOT_AUTH_ADMIN_PASSWORD:?set in pilot.env}
    volumes:
      - auth-pgdata:/var/lib/postgresql
      - ../local-pilot/auth-db-init.sh:/docker-entrypoint-initdb.d/10-auth.sh:ro
    networks:
      - auth-data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: https://auth.oncf-pilot.localhost:8443/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${PILOT_AUTH_ADMIN_PASSWORD:?set in pilot.env}@auth-db:5432/postgres?sslmode=disable
      GOTRUE_DB_MIGRATIONS_PATH: /usr/local/etc/auth/migrations
      GOTRUE_SITE_URL: https://${STAGING_DOMAIN:?set in pilot.env}
      GOTRUE_URI_ALLOW_LIST: https://${STAGING_DOMAIN:?set in pilot.env}/auth/callback**,https://${STAGING_DOMAIN:?set in pilot.env}/auth/confirm**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: 'false'
      # Same rules as the staging project (runbook §3): confirm email, ≥ 8 chars, letters and digits.
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: 'true'
      GOTRUE_PASSWORD_MIN_LENGTH: '8'
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789'
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '10'
      GOTRUE_JWT_ISSUER: https://auth.oncf-pilot.localhost:8443/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Access tokens are signed with the ES256 key; the JWKS publishes only its public half.
      GOTRUE_JWT_KEYS: ${PILOT_JWT_KEYS:?set in pilot.env}
      GOTRUE_JWT_SECRET: ${PILOT_JWT_SECRET:?set in pilot.env}
      GOTRUE_JWT_VALID_METHODS: ES256
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: https://auth.oncf-pilot.localhost:8443/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: https://auth.oncf-pilot.localhost:8443/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: https://auth.oncf-pilot.localhost:8443/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: https://auth.oncf-pilot.localhost:8443/auth/v1/verify
      # Every message stays in the local Mailpit mailbox; nothing is ever delivered.
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@oncf-pilot.test
      GOTRUE_SMTP_SENDER_NAME: ONCF local pilot
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '100'
      GOTRUE_LOG_LEVEL: info
    networks:
      - auth-data
      - auth-app
    depends_on:
      auth-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9999/health']
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - '127.0.0.1:58025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    networks:
      - auth-app
      - mail-ui
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

networks:
  # The API's only outside contact is the auth proxy (JWKS): no internet in the pilot.
  api-egress:
    internal: true
  # GoTrue ↔ its own Postgres.
  auth-data:
    internal: true
  # Caddy ↔ GoTrue ↔ Mailpit (SMTP).
  auth-app:
    internal: true
  # Mailpit's web UI, published on 127.0.0.1 only.
  mail-ui: {}

volumes:
  auth-pgdata: {}
